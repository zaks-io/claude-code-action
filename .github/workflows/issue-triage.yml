name: Issue Triage

on:
  workflow_call:
    inputs:
      allowed_tools:
        description: 'Comma-separated list of allowed tools for Claude'
        type: string
        required: false
        default:
          'Read,Grep,Glob,LS,Bash(gh issue:*),Bash(gh label:*),mcp__linear__*'
      prompt:
        description:
          'Custom prompt to override the default triage behavior (leave empty
          for default)'
        type: string
        required: false
        default: ''
    secrets:
      claude_code_oauth_token:
        description: 'Claude Code OAuth token'
        required: true
      linear_api_token:
        description: 'Linear API token'
        required: true

  repository_dispatch:
    types: [linear-triage]

permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Triage Issue
        uses: anthropics/claude-code-action@v1
        env:
          LINEAR_API_TOKEN:
            ${{ secrets.linear_api_token || secrets.LINEAR_API_TOKEN }}
        with:
          claude_code_oauth_token:
            ${{ secrets.claude_code_oauth_token ||
            secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          settings: |
            {
              "mcpServers": {
                "linear": {
                  "command": "npx",
                  "args": ["-y", "@tacticlaunch/mcp-linear"]
                }
              }
            }
          claude_args:
            --allowedTools "${{ inputs.allowed_tools ||
            github.event.client_payload.allowed_tools ||
            'Read,Grep,Glob,LS,Bash(gh issue:*),Bash(gh label:*),mcp__linear__*'
            }}"
          prompt: |
            ${{ inputs.prompt || github.event.client_payload.prompt || format('**Linear Issue Triage Task**

            A Linear issue needs triage: {0}
            Issue ID: {1}
            Title: {2}

            ## Your Tasks

            ### 1. Fetch Issue Details
            - Use Linear MCP to fetch the full issue details for {1}
            - Review the issue description, labels, and current status

            ### 2. Research the Codebase
            - Search for related code, components, or existing implementations
            - Identify files that would likely need changes
            - Check for similar functionality

            ### 3. Update Linear Ticket
            Update the Linear ticket with your analysis:
            - Files/components likely involved
            - Complexity estimate (small/medium/large)
            - Any dependencies or blockers
            - Implementation suggestions or approach

            ### 4. Update Ticket Status
            - Move the ticket from Triage to the appropriate next status
            - Add any relevant labels if needed

            Be concise and actionable.',
            github.event.client_payload.url,
            github.event.client_payload.issue_id,
            github.event.client_payload.title) }}
