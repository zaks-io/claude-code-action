name: Claude Code

on:
  workflow_call:
    inputs:
      allowed_tools:
        description: 'Comma-separated list of allowed tools for Claude'
        type: string
        required: false
        default: 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*)'
      prompt:
        description: 'Custom prompt to append to the default behavior'
        type: string
        required: false
        default: ''
    secrets:
      claude_code_oauth_token:
        description: 'Claude Code OAuth token'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: 'blacksmith-sh,useotto[bot],useotto-dev[bot]'
          track_progress: true
          claude_args: "--allowedTools '${{ inputs.allowed_tools }}'"
          prompt: ${{ inputs.prompt }}
          additional_permissions: |
            actions: read
